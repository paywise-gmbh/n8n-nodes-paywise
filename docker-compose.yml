services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - N8N_LOG_LEVEL=debug
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dist:/home/node/.n8n/custom/paywise-n8n-node
      - ./dist/paywise.svg:/home/node/.n8n/custom/paywise-n8n-node/paywise.svg
    restart: always

volumes:
  n8n_data:
    driver: local 